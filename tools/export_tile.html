<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>螺纹贴图导出器 → thread_tile.h</title>
<style>
body{margin:0;background:#0A0B0D;color:#E8E8EC;font-family:ui-monospace,Consolas,monospace;
  padding:26px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
h1{font-size:15px;margin:0}
canvas{border:1px solid #26262A;image-rendering:pixelated;background:#000}
.row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
button{font-family:inherit;font-size:12px;padding:8px 14px;background:#1C1C1E;color:#D8D8DC;
  border:1px solid #2C2C2E;border-radius:8px;cursor:pointer}
textarea{width:min(760px,94vw);height:230px;background:#111;color:#9ED9A0;border:1px solid #26262A;
  font-family:inherit;font-size:11px;padding:10px}
p{font-size:12px;color:#8A8A92;line-height:1.7;max-width:700px}
b{color:#E8E8EC}
</style>
</head>
<body>
<h1>螺纹贴图导出器</h1>
<p>渲染 <b>5 个连续周期</b>，只取正中间那个 —— 直接从整屏截一段的话，round cap 会被切断、
上下接缝对不上。输出是 <b>调色板索引</b>（0~7），不是 RGB，所以三个模式共用一张贴图，
换色只改 8 个颜色。</p>

<div class="row">
  <div>
    <canvas id="full" width="120" height="85" style="width:240px;height:170px"></canvas>
    <p>渲染全图（5 周期）</p>
  </div>
  <div>
    <canvas id="tile" width="120" height="17" style="width:240px;height:34px"></canvas>
    <p>取中间一个牙距 · 17×120</p>
  </div>
  <div>
    <canvas id="rep" width="120" height="182" style="width:120px;height:182px"></canvas>
    <p>重复验证：接缝应看不出</p>
  </div>
</div>

<button id="go">导出 thread_tile.h</button>
<textarea id="out" spellcheck="false"></textarea>

<script>
/* 几何参数：必须和 display.h / thread_anim.c 一致 */
const W=120, PITCH=17, CX=60, AMP=46, DEPTH=4.5, WIRE=14;
const CYCLES=5, HFULL=PITCH*CYCLES;

/* 调色板槽位（和 thread_anim.c 的 SLOT_F 对应）——这里只用来预览，
   导出的是索引 */
const SLOT=['#000000','#18100A','#331A05','#57320B','#2A1505','#B24C00','#E58A2B','#FFC48A'];

function drawThread(ctx,h,offset){
  ctx.clearRect(0,0,W,h);
  ctx.fillStyle=SLOT[0]; ctx.fillRect(0,0,W,h);
  const L=CX-AMP-WIRE/2-2, R=CX+AMP+WIRE/2+2;

  /* 芯轴 */
  const core=ctx.createLinearGradient(L,0,R,0);
  core.addColorStop(0,SLOT[2]); core.addColorStop(.5,SLOT[3]); core.addColorStop(1,SLOT[2]);
  ctx.fillStyle=core; ctx.fillRect(L,0,R-L,h);

  /* 牙面 4 档硬边色阶 */
  const g=ctx.createLinearGradient(L,0,R,0);
  const bands=[SLOT[5],SLOT[6],SLOT[7],SLOT[5]];
  bands.forEach((c,i)=>{const a=i/4,b=(i+1)/4;g.addColorStop(a,c);g.addColorStop(b-1e-4,c)});

  const turns=Math.ceil(h/PITCH)+4, total=turns*Math.PI*2, steps=2000;
  const y0=-PITCH*2+offset;
  const back=[],front=[]; let cur=null,sg=null;
  for(let i=0;i<=steps;i++){
    const t=i/steps*total;
    const x=CX+AMP*Math.sin(t), y=y0+(t/(Math.PI*2))*PITCH+DEPTH*Math.cos(t);
    const s=Math.cos(t)>=0?1:-1;
    if(s!==sg){if(cur&&cur.length>1)(sg===1?front:back).push(cur);
      cur=cur&&cur.length?[cur[cur.length-1]]:[];sg=s;}
    cur.push([x,y]);
  }
  if(cur&&cur.length>1)(sg===1?front:back).push(cur);

  const st=(seg,style,w,dx,dy,a)=>{ctx.beginPath();
    seg.forEach((p,i)=>i?ctx.lineTo(p[0]+(dx||0),p[1]+(dy||0)):ctx.moveTo(p[0]+(dx||0),p[1]+(dy||0)));
    ctx.strokeStyle=style;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.globalAlpha=a===undefined?1:a;ctx.stroke();ctx.globalAlpha=1;};

  for(const s of back) st(s,SLOT[1],WIRE+2);
  for(const s of back) st(s,SLOT[3],WIRE);
  for(const s of front)st(s,SLOT[1],WIRE+2);
  for(const s of front)st(s,SLOT[4],WIRE*0.62,0.6,WIRE*0.30,0.95);   /* 牙谷遮蔽 */
  for(const s of front)st(s,g,WIRE);

  /* 右缘冷反光：窄而强，宽而弱在低色深下会变脏色带 */
  const rim=ctx.createLinearGradient(R-4,0,R,0);
  rim.addColorStop(0,'rgba(200,240,255,0)'); rim.addColorStop(1,'rgba(200,240,255,.85)');
  ctx.globalCompositeOperation='lighter'; ctx.fillStyle=rim; ctx.fillRect(R-4,0,4,h);
  ctx.globalCompositeOperation='source-over';
}

const full=document.getElementById('full').getContext('2d');
const tile=document.getElementById('tile').getContext('2d');
const rep =document.getElementById('rep').getContext('2d');
document.getElementById('full').height=HFULL;
document.getElementById('full').style.height=(HFULL*2)+'px';

/* 把像素映射回最近的调色板槽位 */
const PAL=SLOT.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
function nearest(r,g,b){
  let bi=0,bd=1e9;
  PAL.forEach((p,i)=>{const d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2; if(d<bd){bd=d;bi=i}});
  return bi;
}

function build(){
  drawThread(full,HFULL,0);
  const mid=Math.floor((CYCLES-1)/2)*PITCH;            /* 取中间那个周期 */
  const img=full.getImageData(0,mid,W,PITCH);
  tile.putImageData(img,0,0);

  const idx=[];
  for(let y=0;y<PITCH;y++){
    const row=[];
    for(let x=0;x<W;x++){
      const i=(y*W+x)*4;
      row.push(nearest(img.data[i],img.data[i+1],img.data[i+2]));
    }
    idx.push(row);
  }

  /* 重复验证 */
  for(let y=0;y<182;y++) rep.putImageData(img,0,y-(y%PITCH));

  let s='#pragma once\n#include <stdint.h>\n#include "display.h"\n\n';
  s+='/* 由 tools/export_tile.html 生成。索引 0~7 对应 thread_anim.c 的调色板槽位。 */\n';
  s+='static const uint8_t THREAD_TILE[TILE_H][DISP_W] = {\n';
  idx.forEach(r=>{s+='  {'+r.join(',')+'},\n'});
  s+='};\n';
  document.getElementById('out').value=s;
}
document.getElementById('go').onclick=build;
build();
</script>
</body>
</html>
